name: نشر الموقع على GitHub Pages

# الموقع يُنشر حاليًا من فرع gh-pages؛ هذا المسار يدوي فقط (يتطلب Source = GitHub Actions)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # المفتاح العام فقط (آمن للنشر)، والحماية الفعلية عبر RLS
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://pqkaotqtwdaoolbjzpyk.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_6TUp8IMl-Br4lmWOxZ-JHQ_hVFHr85v' }}
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
